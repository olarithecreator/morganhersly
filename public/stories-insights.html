<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stories & Insights - Morgan Hersly</title>
    <style>
        /* Reset and base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background: white;
            color: black;
            line-height: 1.5;
        }

        /* Layout */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Header */
        .header {
            padding: 96px 0 64px;
            text-align: center;
            background: white;
        }

        .header h1 {
            font-size: 48px;
            font-weight: 300;
            letter-spacing: -0.02em;
            margin-bottom: 16px;
            color: black;
        }

        .header p {
            font-size: 18px;
            font-weight: 300;
            color: #666;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Substack embed container */
        .substack-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 24px 64px;
        }

        iframe {
            width: 100%;
            height: 800px;
            border: 1px solid #EEE;
            background: white;
            margin-top: 32px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 36px;
            }

            .header p {
                font-size: 16px;
            }

            iframe {
                height: 600px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="container">
            <h1>Stories & Insights</h1>
            <p>Exploring digital transformation, strategy, and innovation in the modern business landscape.</p>
        </div>
    </div>

    <div class="substack-container">
        <iframe src="https://morganhersly.substack.com/embed" width="100%" height="800" style="border:1px solid #EEE; background:white;" frameborder="0" scrolling="no"></iframe>
    </div>
</body>
</html>
